    <g transform="translate(24, 58)">
      <rect x="0" y="34" width="10" height="38" rx="5" fill="#3B82F6" opacity="0.7"/>
      <rect x="18" y="22" width="10" height="62" rx="5" fill="#38BDF8" opacity="0.82"/>
      <rect x="36" y="10" width="10" height="86" rx="5" fill="#6FE3B0"/>
      <rect x="54" y="26" width="10" height="54" rx="5" fill="#34D399" opacity="0.9"/>
      <rect x="72" y="4" width="10" height="98" rx="5" fill="#6FE3B0"/>
      <rect x="90" y="18" width="10" height="70" rx="5" fill="#60A5FA"/>
      <rect x="108" y="30" width="10" height="46" rx="5" fill="#3B82F6" opacity="0.8"/>
      <rect x="126" y="12" width="10" height="82" rx="5" fill="#6FE3B0"/>
      <rect x="144" y="24" width="10" height="58" rx="5" fill="#38BDF8"/>
      <rect x="162" y="8" width="10" height="90" rx="5" fill="#6FE3B0"/>
      <rect x="180" y="20" width="10" height="66" rx="5" fill="#34D399" opacity="0.9"/>
      <rect x="198" y="32" width="10" height="42" rx="5" fill="#60A5FA" opacity="0.8"/>
      <rect x="216" y="16" width="10" height="74" rx="5" fill="#6FE3B0"/>
      <rect x="234" y="28" width="10" height="50" rx="5" fill="#38BDF8" opacity="0.75"/>
    </g>

    <text x="24" y="186" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">RMS -15.3 dB · Crest 12.5 dB · MP3</text>
  </g>
